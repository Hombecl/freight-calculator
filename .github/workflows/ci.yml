name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests (engines)
        run: npm test
      - name: Build (SPA — prerender runs on deploy machine)
        run: npm run build:spa
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E against preview
        run: |
          npx vite preview --port 4174 --strictPort &
          sleep 3
          PW_BROWSER=chromium node tests/e2e.mjs http://localhost:4174
