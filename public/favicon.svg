<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 3D Box - Isometric Style -->
  <!-- Top face -->
  <polygon points="50,15 85,32 50,49 15,32" fill="#60A5FA"/>
  <!-- Left face -->
  <polygon points="15,32 50,49 50,85 15,68" fill="#2563EB"/>
  <!-- Right face -->
  <polygon points="50,49 85,32 85,68 50,85" fill="#1D4ED8"/>
  <!-- Dimension lines -->
  <line x1="50" y1="15" x2="50" y2="8" stroke="#93C5FD" stroke-width="2"/>
  <line x1="46" y1="8" x2="54" y2="8" stroke="#93C5FD" stroke-width="2"/>
  <line x1="88" y1="50" x2="94" y2="47" stroke="#93C5FD" stroke-width="2"/>
  <line x1="94" y1="43" x2="94" y2="51" stroke="#93C5FD" stroke-width="2"/>
</svg>
