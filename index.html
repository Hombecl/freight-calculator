    <!-- Structured Data / JSON-LD - FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is DimPack3D?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "DimPack3D is a free online 3D packaging calculator designed for e-commerce sellers, Amazon FBA sellers, and freight forwarders. It helps you calculate optimal product-to-carton packing, container loading, CBM (cubic meters), and Amazon FBA size tiers with interactive 3D visualization."
          }
        },
        {
          "@type": "Question",
          "name": "How do I calculate CBM (Cubic Meters)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "To calculate CBM, enter your carton dimensions (length, width, height) in centimeters. DimPack3D automatically converts to cubic meters using the formula: CBM = (Length × Width × Height) / 1,000,000. The calculator also shows total CBM for multiple cartons in your shipment."
          }
        },
        {
          "@type": "Question",
          "name": "What are Amazon FBA size tiers?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Amazon FBA size tiers determine fulfillment fees based on product dimensions and weight. Tiers include Small Standard, Large Standard, Large Bulky, and Extra-Large. DimPack3D uses the 2025 Amazon FBA standards to classify your products and estimate fees."
          }
        },
        {
          "@type": "Question",
          "name": "How many boxes can fit in a 40-foot container?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The number of boxes depends on your carton dimensions. A 40GP container has internal dimensions of approximately 1203 × 235 × 239 cm (67.5 CBM). DimPack3D's container loading calculator optimizes placement and shows exactly how many cartons fit with 3D visualization."
          }
        },
        {
          "@type": "Question",
          "name": "Is DimPack3D free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, DimPack3D is completely free with no registration required. All features including 3D visualization, packing calculator, container loading, and FBA size tier calculations are available at no cost. Your data is saved locally in your browser."
          }
        },
        {
          "@type": "Question",
          "name": "What is dimensional weight and how is it calculated?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dimensional weight (DIM weight) is a pricing technique for freight that considers package size. It's calculated by multiplying Length × Width × Height and dividing by a DIM factor (typically 5000 for air freight, 6000 for sea freight). Carriers charge the greater of actual weight or dimensional weight."
          }
        }
      ]
    }
