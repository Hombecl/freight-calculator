# Cloudflare Pages config — read by `wrangler pages deploy`.
# Functions in ./functions are bundled automatically. LEADS is reserved for
# email capture and share links; usage events go to Analytics Engine.
name = "dimpack3d"
compatibility_date = "2026-01-01"
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding = "LEADS"
id = "13e65133a1414b1ebe5d125d38d43eb8"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "dimpack3d_events"

[[ratelimits]]
name = "HIT_RATE_LIMITER"
namespace_id = "73113005"

  [ratelimits.simple]
  limit = 120
  period = 60
